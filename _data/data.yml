career-profile:
  title: Profil
  summary: |
    Student 3. godine Računarstva i informatike na Sveučilištu Sjever te tehničar
    za električne strojeve s primijenjenim računalstvom. Imam praktično iskustvo
    u razvoju softvera u C/C++, radu s relacijskim bazama podataka, SQL-om, REST
    API-jima, JSON/XML formatima te razvoju desktop i backend aplikacija.

    Tijekom obrazovanja i samostalnog rada razvijao sam aplikacije koje povezuju
    korisničko sučelje, poslovnu logiku, baze podataka i vanjske servise.
    Posebno me zanimaju C/C++, Linux, ugradbeni sustavi te povezivanje softvera
    s fizičkim uređajima i industrijskom opremom.

