projects:
  title: Projekti
  intro: >
    Popis samostalno razvijenih projekata.
  assignments:
  - title: Gume Zelina Planer
    link: "https://github.com/nikolagluhak2206-cmd/GZP-planer" # dodati GitHub poveznicu
    tagline: >
      Samostalno razvijena custom desktop aplikacija za upravljanje terminima i
      poslovnim procesima (C++, Embarcadero RAD Studio, SQL, Microsoft Access,
      ADO, REST API, JSON, XML). Uključuje SQL upite i CRUD operacije,
      autentifikaciju i korisničke uloge, SHA-256 hashiranje lozinki uz salt i
      pepper, AES enkripciju osobnih podataka, generiranje izvještaja,
      lokalizaciju aplikacije te konfiguraciju putem INI datoteka.

  - title: Network Security Lab – MITM Simulacija (Poveznica na airgeddon skriptu)
    link: "https://github.com/v1s1t0r1sh3r3/airgeddon" # poveznica na Airgeddon alat korišten u projektu (osobni repo ne postoji)
    tagline: >
      Akademski projekt iz područja sigurnosti računalnih sustava, izveden u
      kontroliranom laboratorijskom okruženju (Linux, Airgeddon). Obuhvaćao je
      proučavanje koncepta Man-in-the-Middle napada, analizu mrežne
      komunikacije te praktično upoznavanje s osnovama sigurnosti bežičnih
      mreža. U sklopu kolegija Sigurnost računalnih sustava izrađena je i na
      seminaru prezentirana demonstracijska (klonirana) EduAI login stranica,
      korištena za edukativni prikaz phishing tehnika i rizika prikupljanja
      korisničkih vjerodajnica te podizanje svijesti o social engineering
      prijetnjama.

